<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register | SNU Marketplace</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html"
        ><span class="brandmark">SNU</span
        ><span><b>SHIV NADAR UNIVERSITY</b><small>CHENNAI</small></span></a
      >
      <nav><a href="index.html">← Back to marketplace</a></nav>
    </header>
    <main class="auth-wrap">
      <div class="auth-art">
        <div class="art-icon">📚</div>
        <h2>Make campus<br />connections.</h2>
        <p>Join the student community marketplace. Buy, sell and reuse.</p>
      </div>
      <form class="form-card" id="registerForm">
        <span class="eyebrow">JOIN THE COMMUNITY</span>
        <h1>Create your account</h1>
        <label
          >Full name<input id="name" required placeholder="Your name" /></label
        ><label
          >University email<input
            id="email"
            type="email"
            required
            placeholder="you@snuchennai.edu.in" /></label
        ><label
          >Password<input
            id="password"
            type="password"
            minlength="6"
            required
            placeholder="At least 6 characters" /></label
        ><button class="btn full" type="submit">Create account →</button>
        <p class="form-foot">
          Already registered? <a href="login.html">Login</a>
        </p>
        <p id="formMessage" class="message"></p>
      </form>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
