<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | SNU Marketplace</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html"
        ><span class="brandmark">SNU</span
        ><span><b>SHIV NADAR UNIVERSITY</b><small>CHENNAI</small></span></a
      >
      <nav><a href="index.html">← Back to marketplace</a></nav>
    </header>
    <main class="auth-wrap">
      <div class="auth-art">
        <div class="art-icon">🎓</div>
        <h2>Your campus.<br />Your marketplace.</h2>
        <p>Sign in to discover great finds from fellow students.</p>
      </div>
      <form class="form-card" id="loginForm">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Login to your account</h1>
        <label
          >University email<input
            type="email"
            id="email"
            required
            placeholder="you@snuchennai.edu.in" /></label
        ><label
          >Password<input
            type="password"
            id="password"
            required
            placeholder="Enter your password" /></label
        ><button class="btn full" type="submit">Login →</button>
        <p class="form-foot">
          New here? <a href="register.html">Create an account</a>
        </p>
        <p id="formMessage" class="message"></p>
      </form>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
